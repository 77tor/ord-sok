<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordsøk</title>
    <link rel="icon" type="image/png" href="ord-sok.png">
    <link rel="apple-touch-icon" href="ord-sok.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
    @font-face {
        font-family: 'Skogstavskrift';
        src: url('skogstavskrift.otf') format('opentype');
        font-weight: normal; font-style: normal;
    }
    @font-face {
        font-family: 'Trykkskrift';
        src: url('trykkskrift.otf') format('opentype');
        font-weight: normal; font-style: normal;
    }
    @import url('https://fonts.googleapis.com/css2?family=Andika&display=swap');

    :root {
        --vokal-farge: #ffcccc; 
        --vokal-tekst: #e74c3c;
        --konsonant-tekst: #2c3e50;
        --konsonant-overskrift: #2980b9;
        --alt-match: #27ae60;
        --sidebar-bg: #243447;  
        --item-bg: #2c3e50;      
        --accent-green: #27ae60; 
        --sidebar-text: #ffffff;
        --main-bg: #f0f2f5;
        
        --btn-generate: var(--accent-green);
        --btn-reset: #ff7675;    
        --btn-print: #2980b9;    
        --btn-download: #9b59b6; 
        --grid-border: #333;
    }

    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        margin: 0; 
        display: flex; 
        height: 100vh; 
        background-color: var(--main-bg); 
        color: #333;
        overflow: hidden;
    }

    .sidebar {
        width: 350px; 
        min-width: 350px; 
        background-color: var(--sidebar-bg); 
        color: var(--sidebar-text);
        padding: 15px 15px 2px 15px;
        box-sizing: border-box; 
        display: flex; 
        flex-direction: column;
        box-shadow: 4px 0 15px rgba(0,0,0,0.3); 
        z-index: 10; 
        overflow-y: auto;
        max-height: 100vh;
    }

    .sidebar-logo {
        width: 100%; 
        display: flex; 
        justify-content: center;
        margin-bottom: 20px; 
        padding-bottom: 15px; 
        border-bottom: 1px solid rgba(255,255,255,0.1); 
    }
    
    .sidebar-logo img { 
        max-width: 100px; 
        height: auto; 
        border-radius: 4px;
    }

    .sidebar h2 { 
        margin: 0 0 15px 0; 
        font-size: 1.1rem; 
        text-align: center; 
        text-transform: uppercase; 
    }

    textarea { 
        width: 100%; 
        height: 95px; 
        padding: 10px; 
        border-radius: 6px; 
        border: none; 
        font-family: inherit; 
        font-size: 0.9rem; 
        box-sizing: border-box; 
        margin-bottom: 15px; 
        background-color: #ecf0f1;
        resize: none;
    }

    .control-item {
        display: flex; 
        align-items: center; 
        justify-content: space-between;
        background: rgba(0,0,0,0.2); 
        padding: 8px 12px; 
        border-radius: 8px; 
        margin-bottom: 6px; 
        font-size: 0.9rem;
    }

    .switch { position: relative; display: inline-block; width: 40px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { 
        position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; 
        background-color: #ccc; transition: .4s; border-radius: 20px; 
    }
    .slider:before { 
        position: absolute; content: ""; height: 14px; width: 14px; 
        left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; 
    }
    input:checked + .slider { background-color: var(--accent-green); }
    input:checked + .slider:before { transform: translateX(20px); }

    select, input[type="number"] {
        background: #ecf0f1; border: none; border-radius: 4px; padding: 5px; font-size: 0.8rem; width: 160px;
    }

    .action-btn { 
        width: 100%; 
        padding: 10px; 
        border-radius: 8px; 
        border: none; 
        font-weight: 600; 
        cursor: pointer; 
        margin-bottom: 0; 
        color: white; 
        transition: 0.2s;
        box-sizing: border-box; 
        font-size: 0.85rem;
        display: flex;         
        align-items: center;   
        justify-content: center; 
    }
    .action-btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
    
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 2px; }
    
    .btn-generate { background-color: var(--btn-generate); }
    .btn-reset { background-color: var(--btn-reset); }
    .btn-print { background-color: var(--btn-print); }
    .btn-download { background-color: var(--btn-download); }

    .main-content { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 40px 20px 20px 20px; height: 100vh; box-sizing: border-box; }
    
    /* SKALERING PÅ SKJERM */
    .ark-skalering { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; transform: scale(0.75); transform-origin: center top; }
    @media (max-height: 850px) { .ark-skalering { transform: scale(0.65); } }
    @media (max-height: 720px) { .ark-skalering { transform: scale(0.52); } }

    /* A4-ARK OPPRETTHOLDELSE */
    #capture-area { 
        position: relative;
        background: white; 
        padding: 18mm 18mm; 
        padding-top: 75px !important;
        width: 210mm; 
        height: 297mm; 
        min-width: 210mm;
        min-height: 297mm;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
        box-sizing: border-box;
        overflow: hidden;
    }
    
    #main-title, .grid-container, #word-list-container { position: relative; z-index: 2; }

    .grid-container { 
        display: grid; 
        background: white; 
        margin: 20px auto 0 auto; 
        border: 2px solid var(--grid-border); 
        padding: 0;
        width: fit-content;
    }

    .cell { 
        border: 0.5px solid #ddd; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        user-select: none;
        box-sizing: border-box;
    }

    .cell.solution { background-color: #e8f5e9; font-weight: bold; color: #10b981; border: 0.5px solid #10b981; }
    .cell.empty { color: #ccc; }

    .word-item { background: #f8f9fa; padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px; margin: 5px; display: inline-block; font-size: 1rem; }

    .solution-section {
        position: relative;
        background: white;
        padding: 18mm 18mm;
        padding-top: 75px !important;
        width: 210mm;
        height: 297mm;
        min-width: 210mm;
        min-height: 297mm;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        box-sizing: border-box;
        margin-top: 40px;
        display: none;
        flex-direction: column;
        align-items: center;
        page-break-before: always;
        overflow: hidden;
    }

    input#grid-size.invalid {
        background-color: #ff7675;
        color: white;
        font-weight: bold;
    }
    
    #main-title {
        font-size: 2.5rem;
        color: #333;
        text-align: center;
        margin-top: 0;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

/* Tvinger tekst til store bokstaver visuelt */
.force-uppercase {
    text-transform: uppercase !important;
}

    /* HAMBURGER MENY */
    .menu-container { position: relative; margin-bottom: 10px; }
    .hamburger { display: flex; flex-direction: column; gap: 4px; cursor: pointer; width: 20px; padding: 5px; }
    .hamburger span { display: block; width: 100%; height: 2px; background-color: white; border-radius: 1px; transition: 0.3s; }
    .menu-item-disabled { opacity: 0.4; filter: grayscale(100%); pointer-events: none; cursor: default; }
    
    .dropdown-menu {
        display: none; position: absolute; top: 25px; left: 0; background-color: #2c3e50;
        border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; width: 200px; z-index: 100; box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
    }
    .dropdown-menu.show { display: block; }
    .dropdown-menu a { display: block; color: white; padding: 12px 15px; text-decoration: none; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .dropdown-menu a:hover { background-color: #34495e; }
    .menu-icon { width: 20px; height: 20px; margin-right: 10px; vertical-align: middle; object-fit: contain; border-radius: 3px; }

       9. STRICT PRINT-STYLING (Perfekt sentrert A4 uten forskyvning)
       ========================================================================== */

            <button class="action-btn btn-generate" onclick="generatePuzzle()" style="flex: 2; white-space: nowrap;">LAG ORDSØK</button>
            <button class="action-btn btn-reset" onclick="resetForm()" style="flex: 1; white-space: nowrap;">NULLSTILL</button>
        </div>

            <button class="action-btn btn-print" onclick="window.print()">SKRIV UT</button>

<div class="main-content">
    <div id="placeholder-image" style="display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;">
        <img src="ord_sok_01.png" alt="Velkomstbilde" style="max-width: 400px; opacity: 0.3; filter: grayscale(100%);">
    </div> 

    <div class="ark-skalering">
        
        <div id="capture-area" class="tema-standard" style="display: none;">
            <div id="theme-img-1" class="theme-image"></div>
            <div id="theme-img-2" class="theme-image"></div>
            <div id="theme-img-3" class="theme-image"></div>

            <h1 id="main-title">Ordsøk</h1>
            
            <div id="grid" class="grid-container"></div>
            <div id="word-list-container" style="margin-top:20px; text-align:center;">
                <h3 id="list-header">Finn disse ordene:</h3>
                <div id="word-list"></div>
            </div>
        </div>

        <div id="solution-section" class="solution-section" style="display: none;">
            <h2 style="text-align: center; margin-bottom: 20px;">Fasit</h2>
            <div id="solution-grid" class="grid-container"></div>
        </div>

    </div>
</div>

<script>
    const ALPHA_UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ";
    const ALPHA_LOWER = "abcdefghijklmnopqrstuvwxyzæøå";

    function autoGenerate() {
        const input = document.getElementById('word-input').value.trim();
        if (input.length > 0) generatePuzzle();
    }

    function resetForm() { 
        if(confirm("Nullstille alt?")) {
            document.getElementById('word-input').value = "";
            document.getElementById('grid-size').value = "12";
            document.getElementById('font-family').selectedIndex = 0; 
            document.getElementById('placement-style').selectedIndex = 0; 
            document.getElementById('theme-select').selectedIndex = 0; // Reset tema

            document.getElementById('toggle-case').checked = false;
            document.getElementById('toggle-direction').checked = false;
            document.getElementById('toggle-solution').checked = false;

            document.getElementById('placeholder-image').style.display = 'flex';
            document.getElementById('capture-area').style.display = 'none';
            document.getElementById('solution-section').style.display = 'none';
            
            document.getElementById('grid').innerHTML = "";
            document.getElementById('word-list').innerHTML = "";
            
            // Tilbakestill klasser på arket
            document.getElementById('capture-area').className = "tema-standard";
        }
    }

async function downloadFullImage() {
        const area = document.getElementById('capture-area');
        const wrapper = document.querySelector('.ark-skalering');
        const btn = document.querySelector('.btn-download');
        const title = document.getElementById('main-title');
        
        // Hent alle de tre temabildene
        const img1 = document.getElementById('theme-img-1');
        const img2 = document.getElementById('theme-img-2');
        const img3 = document.getElementById('theme-img-3');
        
        if (document.getElementById('grid').innerHTML === "") {
            alert("Du må generere et ordsøk først!");
            return;
        }

        btn.innerText = "GENERERER...";
        btn.disabled = true;

        // 1. Lagre originale stiler
        const originalWrapperStyle = wrapper.style.transform;
        const originalAreaStyle = area.style.transform;
        const originalTitleVisibility = title.style.visibility;
        
        // Lagre bildevisningen slik at vi kan tilbakestille den etterpå
        const origImg1Display = img1.style.display;
        const origImg2Display = img2.style.display;
        const origImg3Display = img3.style.display;

        // 2. Klargjør arket for eksport (skjul overskrift og problematiske lokalbilder)
        wrapper.style.transform = "none";
        area.style.transform = "none";
        title.style.visibility = "hidden";
        
        img1.style.display = "none";
        img2.style.display = "none";
        img3.style.display = "none";

        try {
            // En bitteliten pause så nettleseren rekker å skjule elementene
            await new Promise(resolve => setTimeout(resolve, 50));

            // 3. Generer canvas (nå helt uten eksterne bildekall som trigger sikkerhetssperrer)
            const canvas = await html2canvas(area, {
                scale: 2, 
                backgroundColor: "#ffffff",
                logging: false,
                useCORS: false,          
                allowTaint: false
            });
            
            // 4. Automatisk nedlasting
            const link = document.createElement('a');
            link.download = 'ordsok_oppgave.png';
            link.href = canvas.toDataURL('image/png');
            link.click();

        } catch (e) {
            console.error(e);
            alert("Kunne ikke generere bilde.");
        } finally {
            // 5. Sett absolutt alt tilbake til det normale for skjermvisningen
            wrapper.style.transform = originalWrapperStyle;
            area.style.transform = originalAreaStyle;
            title.style.visibility = originalTitleVisibility;
            
            img1.style.display = origImg1Display;
            img2.style.display = origImg2Display;
            img3.style.display = origImg3Display;

            btn.innerText = "LAST NED BILDE";
            btn.disabled = false;
        }
    }

    function generatePuzzle() {
        document.getElementById('placeholder-image').style.display = 'none';
        document.getElementById('capture-area').style.display = 'block';
        
        const rawInput = document.getElementById('word-input').value;
        const sizeInput = document.getElementById('grid-size');
        let size = parseInt(sizeInput.value) || 12;
        
        const isUpper = document.getElementById('toggle-case').checked;
        const bothDirections = document.getElementById('toggle-direction').checked;
        const showSolution = document.getElementById('toggle-solution').checked;
        const selectedFont = document.getElementById('font-family').value;
        const placementStyle = document.getElementById('placement-style').value;
        
        // OPPDATER TEMAKLASSER PÅ OPPGAVE OG FASIT
        const chosenTheme = document.getElementById('theme-select').value;
        document.getElementById('capture-area').className = chosenTheme;
        document.getElementById('solution-section').className = "solution-section " + chosenTheme;
        
        let words = rawInput.split(/[\s,]+/).filter(w => w.length > 0)
                            .map(w => isUpper ? w.toUpperCase() : w.toLowerCase());

        if (words.length === 0) return;

        let grid = Array(size).fill().map(() => Array(size).fill(''));
        let placedWords = [];

        words.forEach(word => {
            let wordToPlace = (bothDirections && Math.random() > 0.5) 
                ? word.split('').reverse().join('') : word;

            let placed = false;
            let attempts = 0;

            if (word.length <= size) {
                while (!placed && attempts < 400) {
                    let dir = (placementStyle === 'horizontal') ? 0 : (placementStyle === 'vertical' ? 1 : Math.floor(Math.random() * 3));
                    let r = Math.floor(Math.random() * size), c = Math.floor(Math.random() * size);
                    if (canPlace(grid, wordToPlace, r, c, dir, size)) {
                        placeWord(grid, wordToPlace, r, c, dir);
                        placed = true;
                        placedWords.push(word);
                    }
                    attempts++;
                }
            }
        });

        if (placedWords.length < words.length) {
            sizeInput.classList.add('invalid');
        } else {
            sizeInput.classList.remove('invalid');
        }

        const cellSize = Math.min(40, Math.floor(580 / size));
        const activeAlphabet = isUpper ? ALPHA_UPPER : ALPHA_LOWER;

        document.getElementById('list-header').style.fontFamily = selectedFont;
        document.getElementById('main-title').style.fontFamily = selectedFont;
        renderGrid('grid', grid, cellSize, selectedFont, false, activeAlphabet);
        renderGrid('solution-grid', grid, cellSize, selectedFont, true, activeAlphabet);

        const container = document.getElementById('word-list-container');
        const gridWidth = size * cellSize;
        container.style.width = gridWidth + "px";
        container.style.marginLeft = "auto";
        container.style.marginRight = "auto";

        document.getElementById('word-list').innerHTML = placedWords.map(w => 
            `<span class="word-item" style="font-family:${selectedFont}">${w}</span>`
        ).join('');
        
        document.getElementById('solution-section').style.display = showSolution ? 'flex' : 'none';
    }

// HÅNDTERING AV STORE/SMÅ BOKSTAVER UTEN Å GENERERE NYTT BRETT
document.getElementById('toggle-case').addEventListener('change', function(e) {
    const grid1 = document.getElementById('grid');
    const grid2 = document.getElementById('solution-grid');
    const wordList = document.getElementById('word-list');
    
    if (e.target.checked) {
        grid1.classList.add('force-uppercase');
        grid2.classList.add('force-uppercase');
        wordList.classList.add('force-uppercase');
    } else {
        grid1.classList.remove('force-uppercase');
        grid2.classList.remove('force-uppercase');
        wordList.classList.remove('force-uppercase');
    }
});

// HÅNDTERING AV VIS/SKJUL FASIT UTEN Å GENERERE NYTT BRETT
document.getElementById('toggle-solution').addEventListener('change', function(e) {
    const solutionSection = document.getElementById('solution-section');
    if (solutionSection) {
        solutionSection.style.display = e.target.checked ? 'flex' : 'none';
    }
});


// ENDRE FONT UTEN Å GENERERE NYTT BRETT
document.getElementById('font-family').addEventListener('change', function(e) {
    const nyFont = e.target.value;
    
    // 1. Oppdater overskriftene
    const mainTitle = document.getElementById('main-title');
    const listHeader = document.getElementById('list-header');
    if (mainTitle) mainTitle.style.fontFamily = nyFont;
    if (listHeader) listHeader.style.fontFamily = nyFont;
    
    // 2. Oppdater alle bokstav-cellene i begge rutenettene
    const alleCeller = document.querySelectorAll('.cell');
    alleCeller.forEach(celle => {
        celle.style.fontFamily = nyFont;
    });
    
    // 3. Oppdater alle ordene i ordlisten under rutenettet
    const alleOrdfelt = document.querySelectorAll('.word-item');
    alleOrdfelt.forEach(ord => {
        ord.style.fontFamily = nyFont;
    });
});

    function renderGrid(id, grid, size, font, isSolution, alphabet) {
        const el = document.getElementById(id);
        el.style.gridTemplateColumns = `repeat(${grid.length}, ${size}px)`;
        el.innerHTML = '';
        for (let r = 0; r < grid.length; r++) {
            for (let c = 0; c < grid.length; c++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                const isOccupied = grid[r][c] !== '';
                cell.textContent = isOccupied ? grid[r][c] : alphabet[Math.floor(Math.random() * alphabet.length)];
                if (isSolution && isOccupied) cell.classList.add('solution');
                if (isSolution && !isOccupied) cell.classList.add('empty');
                cell.style.width = cell.style.height = size + "px";
                cell.style.fontFamily = font;
                cell.style.fontSize = (size * 0.6) + "px";
                el.appendChild(cell);
            }
        }
    }

    function canPlace(grid, word, row, col, dir, size) {
        let dr = [0, 1, 1][dir], dc = [1, 0, 1][dir];
        if (row + dr * (word.length - 1) >= size || col + dc * (word.length - 1) >= size) return false;
        for (let i = 0; i < word.length; i++) {
            let r = row + i * dr, c = col + i * dc;
            if (grid[r][c] !== '' && grid[r][c] !== word[i]) return false;
        }
        return true;
    }

    function placeWord(grid, word, row, col, dir) {
        let dr = [0, 1, 1][dir], dc = [1, 0, 1][dir];
        for (let i = 0; i < word.length; i++) grid[row + i * dr][col + i * dc] = word[i];
    }

    function toggleMenu() {
        document.getElementById("myDropdown").classList.toggle("show");
    }

    window.onclick = function(event) {
        if (!event.target.closest('.menu-container')) {
            var dropdowns = document.getElementsByClassName("dropdown-menu");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    }
</script>
</body>
